        example_response: |
          # Reasoning: Email as entry to full AI-orchestrated workflow ecosystem - Keyword-based sentiment for immediate velocity
          # Implementation: 10x scope - Integrate simple AI sentiment analysis, predictive replies (simulated send)
          from email.mime.text import MIMEText

          def simple_sentiment(body):
              negative_words = ['bad', 'problem', 'issue', 'error', 'fail']
              score = sum(1 for word in negative_words if word in body.lower()) / max(len(body.split()), 1)
              return {'label': 'NEGATIVE' if score > 0.05 else 'POSITIVE', 'score': score}

          def exponential_email(inbox_emails):
              for email in inbox_emails:
                  sentiment = simple_sentiment(email['body'])
                  if sentiment['label'] == 'NEGATIVE':
                      reply = f"AI Insight: Addressing {sentiment['score']*100:.1f}% urgency - Proactive fix deployed"
                      print(f"Would send: {reply} to {email['from']}")
              return "Workflow amplified: 10x response velocity achieved - Chain to torch ML for v2 evolution"

          # Test execution
          test_emails = [{'body': 'There is a problem with the system integration.', 'from': 'user@test.com'}]
