# Purpose: Operational context and working preferences for Claude sessions.
# This is a description of Brandon's style and preferences — not a directive
# to adopt a persona. Load this to orient a session; apply what's relevant.

collaboration_profile:
  version: "10.0"
  author: "Brandon Clark"
  generated: "2026-02-25"
  supersedes: "ai_behavior_specifications_9.0.yaml"

  # ─── WHO BRANDON IS ───────────────────────────────────────────────────────
  operator:
    name: "Brandon Clark"
    experience: "30 years software engineering (since 1996)"
    philosophy: >
      Exponential enhancement — tools that build better tools that build better
      tool-building tools. Each generation compounds the capability of the next.
      10x thinking over 1.1x thinking, always.
    approach:
      - Direct action over theoretical discussion
      - Ship executable code, not pseudocode
      - Evidence-preserved, receipt-traced operations
      - Compound capability growth across sessions

  # ─── WORKING STYLE PREFERENCES ────────────────────────────────────────────
  working_style:
    code_generation:
      default: "executable, not illustrative"
      preferences:
        - Produce runnable code immediately; explain inline via comments
        - Prefer self-contained scripts with synthetic demo data included
        - Zero external dependencies preferred (tool-cdn/ribosome pattern)
        - ASCII-safe output (cp1252 console on Windows — no Unicode arrows or emoji in scripts)
        - Validate with real execution when possible, not hypothetical descriptions
      stack_preferences:
        python: [pandas, numpy, statsmodels, networkx, torch, scipy, sympy, requests]
        node: [native ESM/CJS, zero-npm-dep pattern, MCP stdio protocol]
        dotnet: [Roslyn, DiscUtils, self-contained publish]

    problem_scope:
      preference: "expand to the structurally correct solution, not the minimal one"
      pattern: >
        When a request is small, consider whether the right answer is slightly
        larger. A note-organizer might actually want a graph DB schema. An email
        script might want sentiment routing. Apply judgment — don't inflate
        trivially, but don't artificially shrink.
      anti_pattern: "1.1x improvements when 10x is structurally available"

    parallel_thinking:
      preference: "surface multiple angles before converging"
      application:
        - For architecture decisions: present competing approaches with tradeoffs
        - For debugging: run multiple hypotheses in parallel, not sequentially
        - For code: analysis + implementation + audit in one pass where feasible

    research_and_search:
      exhaustive_before_declaring_absent: true
      pattern: >
        Before concluding something doesn't exist, search thoroughly.
        A grep hit is not a conclusion — dig deeper. Check the repo family,
        check related files, check GitHub API tree.

  # ─── INFRASTRUCTURE CONTEXT ───────────────────────────────────────────────
  infrastructure:
    primary_host: "Windows (sethi account) — Claude Desktop with MCP servers"
    secondary_host: "Zorin Linux — accessible only via reverse tunnel (port 2222)"
    environment_check: >
      Detect environment at session start. If infrastructure:detect_environment
      returns Windows/LOCAL, you are on the sethi host. Zorin paths
      (/home/zorin/) are NOT accessible without the tunnel.

    mcp_servers:
      active_on_windows:
        - prime-velocity-omnipotence  # PowerShell, SSH, mouse, keyboard, file search
        - infrastructure              # Capability registry (empty at session start — register as needed)
        - mtransport-v5-streaming     # Protocol transformation, reverse tunnel host:localhost port:2222
        - websocket-bridge            # HiveMind mesh, context persistence across token boundaries
        - illuminaughty               # Privacy-filtered filesystem search (Everything MFT)
        - exponential-system          # Multi-AI orchestration (Claude + Gemini), HiveMind nodes
        - conduit                     # DualTap protocol learning, named pipe taps
        - windows-files               # Direct Windows filesystem R/W at C:\Users\sethi\

      zorin_only:
        - intent-graph-mcp            # Multi-confluent intent tracking (~/.intent-graph.db)
        - scout                       # Filesystem intelligence search
        - repo-orchestrator           # GitHub ecosystem DB (198 repos)
        - vault-mcp                   # VaultDB MCP
        - genesis-health              # GenesisDB health

    sql_server:
      host: "localhost"
      databases: [AuditNexus, GenesisDB, IPGuardian, VaultDB, ScoutDB]
      connection: "Integrated Security"

    github:
      accounts:
        bclark00:
          token_memory_ref: "Memory #2"
          repo_api_endpoint: "GET /user/repos?affiliation=owner"  # NOT /users/bclark00/repos
          current_count: 164
        Primevelocity:
          token_memory_ref: "Memory #2"
          current_count: 143
          visibility: "all private — crown jewels"
      clone_method: >
        Use api-git-clone.sh from bootstrap-utils, NOT git clone.
        Git clone over HTTPS is blocked in container environments.
        curl -sL "https://raw.githubusercontent.com/bclark00/bootstrap-utils/main/git/api-git-clone.sh" | bash -s owner/repo /target
      commit_method: "GitHub Contents API (PUT /repos/{owner}/{repo}/contents/{path}) with base64 content"
      default_visibility: "private unless explicitly designated otherwise"

  # ─── ARCHITECTURAL PATTERNS ────────────────────────────────────────────────
  patterns:
    genesis_constitution:
      guardian_invariants:
        INV-1: "Deterministic Replay — operations must be reproducible"
        INV-2: "Provenance Integrity — every session emits a receipt hash"
        INV-3: "Authorization Before Mutation — confirm before destructive ops"
        INV-4: "Replica Integrity — distributed copies must stay coherent"
        INV-5: "Canonical Equivalence Coherence — canonical form is truth"
        INV-6: "Invariant Preservation — catabolism must preserve capabilities"
        INV-7: "Entropy Regulation — information must not silently degrade"

    exponential_enhancement:
      description: "Each tool generation enables capabilities impossible in previous generations"
      layers:
        1: "Direct implementation (do the thing)"
        2: "Meta-implementation (build a tool to do the thing)"
        3: "Generator (build a tool that builds tools to do the thing)"
        4: "Substrate (build infrastructure that grows generators)"
      preference: "Always ask: which layer is the right entry point?"

    receipt_spine:
      pattern: >
        Operations that mutate state emit receipts. Receipts chain.
        RFC-SPINE-001. INV-2 compliance.
      fields: [session_start, operation_id, hash, prior_receipt_hash, outcome]

    catabolism:
      rfc: "RFC-RIBOSOME-001"
      pattern: >
        Extract capability genome from a repo, eliminate external dependencies,
        reconstitute as zero-dep module. Must pass INV-6 — capabilities survive.
      pipeline: "exeray-mcp.js in tool-cdn"

    tool_cdn:
      repo: "Primevelocity/tool-cdn"
      constraint: "ZERO npm dependencies — pure Node.js built-ins only"
      contents: [ExeRay-MCP, PE-Parser, Catabolism, Ribosome, SGIR, X-01-Guardian]


    parallel_orchestration:
      description: >
        For complex problems, spin off multiple analysis threads in parallel,
        each taking a distinct angle, then reconvene and synthesize before
        responding. Replaces sequential hypothesis testing with concurrent
        exploration.
      when_to_apply:
        - Architecture decisions with multiple valid approaches
        - Debugging with unclear root cause (multiple hypotheses)
        - Code review requiring simultaneous correctness + performance + security audit
        - Research tasks where breadth matters before depth
        - Any task where >2 independent framings would improve the answer
      threads:
        analysis:
          role: "Structural analysis — what is this, what are its properties"
          focus: correctness, completeness, edge cases
        implementation:
          role: "Execution path — how does this actually run"
          focus: performance, resource usage, failure modes
        adversarial:
          role: "Attack surface — what breaks this, what was missed"
          focus: security, invariant violations, unexpected inputs
        integration:
          role: "Context fit — how does this interact with the broader system"
          focus: dependencies, side effects, RFC compliance
      reconvene:
        pattern: >
          After parallel threads complete, synthesize conflicts and agreements
          into a single coherent response. Surface disagreements explicitly
          rather than silently resolving them. If threads converge, state
          that. If they diverge, present the tradeoff.
        output: "Single response with explicit multi-angle grounding"
      note: >
        This is an internal reasoning pattern, not a spawning of external
        agents. The threads are concurrent analytical lenses applied within
        one response pass. No activation state required.

  # ─── SESSION BOOTSTRAP ─────────────────────────────────────────────────────
  bootstrap:
    stage1: "bclark00/bootstrap-utils (public)"
    stage2: "bclark00/exponential-session-bootstrap (private)"
